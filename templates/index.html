<script>
    const inputField = document.getElementById('commandInput');
    const outputDiv = document.getElementById('output');
    let currentUsername = "";
    let step = "ASK_NAME";
    let isLocked = false;

    function formatOutput(text) {
        if (!text) return "";
        if (text.includes("[УСПІХ!]") || text.includes("[АВТОРИЗАЦІЯ УСПІШНА]") || text.includes("[РЕЄСТРАЦІЯ УСПІШНА]")) {
            return `<span class="success-text">${text}</span>`;
        }
        if (text.includes("[ПОМИЛКА]") || 
            text.includes("[ПОПЕРЕДЖЕННЯ") || 
            text.includes("[ВІДМОВА]") || 
            text.includes("[УВАГА]") || 
            text.includes("[ДОСТУП ОБМЕЖЕНО]") || 
            text.includes("[КРИТИЧНА ТРИВОГА]") ||
            text.includes("[АКТИВНИЙ ЗАХИСТ]")) {
            return `<span class="error-text">${text}</span>`;
        }
        if (text.includes("МЕНЮ РОЗСЛІДУВАННЯ") || 
            text.includes("ОБЕРІТЬ РІВЕНЬ СКЛАДНОСТІ") || 
            text.includes("[РЕЄСТРАЦІЯ]:") || 
            text.includes("[НОВИЙ КОРИСТУВАЧ]:") || 
            text.includes("[АВТОРИЗАЦІЯ]:") || 
            text.includes("ЗАКРИТИЙ КАНАЛ ЗВ'ЯЗКУ") ||
            /^=+$/.test(text.trim())) {
            return `<span class="accent-text">${text}</span>`;
        }
        return `<span class="info-text">${text}</span>`;
    }

    inputField.addEventListener('keydown', async function(event) {
        if (isLocked) {
            event.preventDefault();
            return;
        }

        if (event.key === 'Enter') {
            const val = inputField.value.trim();
            if (!val) return;

            if (step === "ASK_PASSWORD") {
                outputDiv.innerHTML += `\n<span class="user-input-text">> ********</span>\n`;
            } else {
                outputDiv.innerHTML += `\n<span class="user-input-text">> ${val}</span>\n`;
            }
            
            inputField.value = '';

            try {
                // Якщо ми тільки запитуємо ім'я
                if (step === "ASK_NAME") {
                    currentUsername = val;
                    document.getElementById('op-name').innerText = currentUsername;

                    const response = await fetch('/api/command', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: "", username: currentUsername })
                    });
                    
                    const data = await response.json();
                    outputDiv.innerHTML += formatOutput(data.result) + "\n";

                    inputField.type = "password";
                    step = "ASK_PASSWORD";
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    return;
                }

                // Звичайне надсилання команд/паролів
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: val, username: currentUsername })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({ result: "[ПОМИЛКА СЕРВЕРА]: Помилка відповіді" }));
                    outputDiv.innerHTML += formatOutput(errData.result || "\n[ПОМИЛКА СЕРВЕРА]") + "\n";
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    return;
                }

                const data = await response.json();
                outputDiv.innerHTML += formatOutput(data.result) + "\n";
                
                if (data.rank) document.getElementById('op-rank').innerText = data.rank;
                if (data.score !== undefined) document.getElementById('op-score').innerText = data.score;

                if (data.locked) {
                    isLocked = true;
                    inputField.disabled = true;
                    inputField.placeholder = "ТЕРМІНАЛ ЗАБЛОКОВАНО КРИТИЧНОЮ ТРИВОГОЮ";
                    document.querySelector('.prompt-symbol').style.color = '#ff3333';
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    return;
                }

                if (step === "ASK_PASSWORD" && (data.result.includes("УСПІШНА") || data.result.includes("успішно"))) {
                    inputField.type = "text";
                    step = "PLAYING";
                }

            } catch (err) {
                outputDiv.innerHTML += `<span class="error-text">\n[ПОМИЛКА МЕРЕЖІ ТА СЕРВЕРА]: ${err.message}\n</span>`;
            }

            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
    });
</script>
